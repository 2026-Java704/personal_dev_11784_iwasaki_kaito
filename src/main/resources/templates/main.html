<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>メイン画面</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
	<header th:replace="~{header}"></header>
		<hr>

	<h1>服薬一覧</h1>
	<table border="1">
		<tr>
			<th>No</th>
			<th>名前</th>
			<th>個数</th>
			<th>飲んだかチェック</th>
			<th>備考</th>
			<th>更新</th>
			<th>削除</th>
		</tr>
		<tr th:each="medic:${medicines}">
			<td th:text="${medic.id}"></td>
			<td th:text="${medic.name}"></td>
			<td th:text="${medic.count}"></td>
			
			<td>
				
				<div th:unless="${medic.check}">
					<form th:action="'/medicine/'+${medic.id}+'/edit'" method="post">
					飲んでいません	
					<input type="checkbox" name="check" value="true" th:checked="${medic.check}">
					</form>	
				</div>
				
				<div th:if="${medic.check}">
					飲みました
				</div>
			</td>
			<td th:text="${medic.note}"></td>
			<td>
			<form th:action="'/medicine/'+${medic.id}+'/edit'" method="get">
			  	<input type="submit" value="更新">
			</form>
			</td>
			
			<td>
			<form th:action="'/medicine/'+${medic.id}+'/delete'" method="post">
				<input type="submit" value="削除">
			</form>
			</td>
		</tr>
	</table>
	<form action="/medicine/add" method="get">
		<button>薬の追加</button>
	</form>
</body>
</html>
