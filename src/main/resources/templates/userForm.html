<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>新規登録</title>
</head>
<body>
	<h1>新規登録</h1>
	<h3>お客様情報</h3>
		<form action="/account" method="post">
			<ul th:if="${errorList}">
			<p th:each="error:${errorList}" th:text="${error}" style="color: red"></br>
			</ul>

		<table border="1">
			<tr>
				<th>お名前</th>
					<td>
					<input type="text" name="name">
					</td>
			</tr>
			<tr>
				<th>パスワード</th>
				<td>
				<input type="text" name="password">
				</td>
			</tr>
		</table>
		<button>登録</button>
		</form>
</body>
</html>
