<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>ログイン</title>
</head>
<body>
	<header>
		<h1>ログイン</h1>
	</header>
	<main>
		<form action="/login" method="post">
			<input type="text" name="name" placeholder="名前"><br>
			<input type="text" name="password" placeholder="パスワード"><br>
			<button>ログイン</button>
			<br> <span th:text="${message}" style="color: red"></span>
			<br>
			<a href="/account" style="padding-left: 10px;">新規登録</a>
		</form>
	</main>
</body>
</html>
